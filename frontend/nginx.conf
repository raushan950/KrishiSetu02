server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /media/ { alias /usr/share/nginx/html/media/; add_header X-Content-Type-Options nosniff always; }
    location /health/ { proxy_pass http://backend:8000; }
    location / { try_files $uri $uri/ /index.html; }
    client_max_body_size 6m;
}
